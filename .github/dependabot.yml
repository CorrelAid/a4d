# Action versions and Python dependencies went stale unnoticed until someone
# looked: checkout was three majors behind and the uv setup action eight.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      python-dependencies:
        patterns: ["*"]
