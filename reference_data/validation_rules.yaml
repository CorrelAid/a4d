# Python Pipeline Validation Rules
#
# This file defines allowed values for data validation in the Python pipeline.
# It is separate from data_cleaning.yaml (used by R pipeline) to allow
# independent evolution of the two pipelines.
#
# Structure:
#   column_name:
#     allowed_values: [list of valid values]
#     replace_invalid: true/false (whether to replace with error value)
#
# Note: Data transformations are hardcoded in src/a4d/clean/transformers.py,
# not defined in YAML.

# Numeric range bounds consumed by src/a4d/validate/source_vs_output_patient.py
# only. Mirrors the hardcoded thresholds in src/a4d/clean/patient.py:510-562.
# Single-source-of-truth refactor blocked by patient.py being a golden file
# (see CLAUDE.local.md). If you change one, change the other.
# height bounds apply AFTER the cm->m auto-conversion at clean/patient.py:530-535.
numeric_ranges:
  height:           {min: 0.0,  max: 2.3}
  weight:           {min: 0.0,  max: 200.0}
  bmi:              {min: 10.0, max: 80.0}
  age:              {min: 0,    max: 100}
  hba1c_baseline:   {min: 0.0,  max: 25.0}
  hba1c_updated:    {min: 0.0,  max: 25.0}
  fbg_updated_mmol: {min: 0.0,  max: 150.0}

analog_insulin_long_acting:
  allowed_values: ["N", "Y"]
  replace_invalid: true

analog_insulin_rapid_acting:
  allowed_values: ["N", "Y"]
  replace_invalid: true

clinic_visit:
  allowed_values: ["N", "Y"]
  replace_invalid: true

complication_screening_eye_exam_value:
  allowed_values: ["Normal", "Abnormal"]
  replace_invalid: true

complication_screening_foot_exam_value:
  allowed_values: ["Normal", "Abnormal"]
  replace_invalid: true

dm_complication_eye:
  allowed_values: ["N", "Y"]
  replace_invalid: true

dm_complication_kidney:
  allowed_values: ["N", "Y"]
  replace_invalid: true

dm_complication_others:
  allowed_values: ["N", "Y"]
  replace_invalid: true

hospitalisation_cause:
  allowed_values: ["DKA", "HYPO", "HYPER", "OTHER"]
  replace_invalid: true

human_insulin_intermediate_acting:
  allowed_values: ["N", "Y"]
  replace_invalid: true

human_insulin_pre_mixed:
  allowed_values: ["N", "Y"]
  replace_invalid: true

human_insulin_short_acting:
  allowed_values: ["N", "Y"]
  replace_invalid: true

insulin_regimen:
  # Note: Values are transformed by extract_regimen() in transformers.py first
  allowed_values:
    - "Basal-bolus (MDI)"
    - "Premixed 30/70 BD"
    - "Self-mixed BD"
    - "Modified conventional TID"
  replace_invalid: false  # Don't replace - these are post-transformation values

insulin_type:
  allowed_values: ["Human Insulin", "Analog Insulin"]
  replace_invalid: true

insulin_subtype:
  # Python's builder emits comma-joined values (e.g. "pre-mixed,rapid-acting") for
  # multi-insulin patients, matching R's builder. R's validator treated the CSV as a
  # single opaque string and rejected it, so R output "Undefined" for every multi-insulin
  # patient. Python uses allow_csv_subset=true: each comma-separated token is validated
  # against allowed_values independently, then rejoined in canonical case.
  # R's "rapic-acting" typo is already corrected in Python's builder (clean/patient.py).
  allowed_values:
    - "Pre-mixed"
    - "Short-acting"
    - "Intermediate-acting"
    - "Rapid-acting"
    - "Long-acting"
  replace_invalid: true
  allow_csv_subset: true

observations_category:
  allowed_values:
    - "Status IN"
    - "Status OUT"
    - "Clinic Follow Up"
    - "Hospitalisation"
    - "Support"
    - "DM Complication"
    - "Insulin Regimen"
    - "Other"
  replace_invalid: false

patient_consent:
  allowed_values: ["N", "Y"]
  replace_invalid: true

remote_followup:
  allowed_values: ["N", "Y"]
  replace_invalid: true

status:
  # Canonical values in Title Case. Validation is case-insensitive.
  # If matched, returns the canonical value (e.g., "active" → "Active")
  allowed_values:
    - "Active"
    - "Active Remote"
    - "Active Monitoring"
    - "Query"
    - "Inactive"
    - "Transferred"
    - "Lost Follow Up"
    - "Deceased"
    - "Discontinued"
  # Canonical label -> the retired spellings it absorbs. Reports need one
  # label per status, so which spelling wins is declared here rather than
  # left to the order allowed_values happens to list (ticket 29).
  # "Active - Remote" is how 2020-2023 trackers wrote it; the Lookup List
  # dropdown introduced with the 2024 template redesign defines only
  # "Active Remote", which every 2024+ tracker uses.
  aliases:
    "Active Remote":
      - "Active - Remote"
  replace_invalid: true

support_level:
  allowed_values:
    - "Standard"
    - "Partial"
    - "Partial - A"
    - "Partial - B"
    - "Semi-Partial"
    - "SAC"
    - "Monitoring"
  replace_invalid: true

t1d_diagnosis_with_dka:
  allowed_values: ["N", "Y"]
  replace_invalid: true
